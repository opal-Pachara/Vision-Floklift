services:
  - type: web
    name: yolo-safety-monitor
    runtime: docker
    plan: free
    region: singapore # หรือ oregon, frankfurt ตามสะดวก
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: PORT
        value: 8080
      - key: PYTHONUNBUFFERED
        value: "1"
    healthCheckPath: /api/status
